<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>rfister database</title>


  <style>

    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 15px;
    }

    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .controls input[type="text"] {
      width: 320px;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #aaa;
      border-radius: 5px;
    }

    .clanner-filter {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 12px;
      background: white;
      border: 1px solid #aaa;
      border-radius: 5px;
      cursor: pointer;
      user-select: none;
    }

    .clanner-filter input {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    #count {
      margin: 10px 0;
      color: #555;
    }

    .table-container {
      overflow-x: auto;
      overflow-y: auto;
      max-height: 75vh;
      border: 1px solid #ccc;
      background: white;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      white-space: nowrap;
    }

    th,
    td {
      padding: 8px 12px;
      border: 1px solid #ddd;
      text-align: left;
    }

    th {
      background: #222;
      color: white;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    tr:nth-child(even) {
      background: #f7f7f7;
    }

    tr:hover {
      background: #e8e8e8;
    }

    .changed {
      font-weight: bold;
    }

    .same-name {
      color: #999;
    }

    .yes {
      font-weight: bold;
    }

    .no {
      color: #999;
    }

  </style>

</head>


<body>


<h1>
  rfister database
</h1>


<div class="controls">

  <input
    id="usernameSearch"
    type="text"
    placeholder="Search current or old username..."
    autocomplete="off"
  >

  <input
    id="userIdSearch"
    type="text"
    placeholder="Search user ID..."
    autocomplete="off"
    inputmode="numeric"
  >

  <label class="clanner-filter">

    <input
      type="checkbox"
      id="clannerCheckbox"
    >

    Clanner

  </label>

</div>


<div id="count">
  Loading database...
</div>


<div class="table-container">

<table>

  <thead>

    <tr>

      <th>Current Username</th>

      <th>User ID</th>

      <th>Old / Logged Username</th>

      <th>Hits</th>

      <th>First Seen</th>

      <th>Last Seen</th>

      <th>Clanner</th>

    </tr>

  </thead>

  <tbody id="tableBody"></tbody>

</table>

</div>


<script>

  let users = [];

  let userPlaces = {};

  let clannerPlaces = new Set();

  let searchTimer = null;


  const usernameSearch =
    document.getElementById("usernameSearch");

  const userIdSearch =
    document.getElementById("userIdSearch");

  const clannerCheckbox =
    document.getElementById("clannerCheckbox");

  const tableBody =
    document.getElementById("tableBody");

  const count =
    document.getElementById("count");


  /*
    Load:

    verified_users.json
    user_places.json
    places.json
  */

  Promise.all([

    fetch("verified_users.json")
      .then(response => {

        if (!response.ok) {
          throw new Error(
            "Could not load verified_users.json"
          );
        }

        return response.json();

      }),


    fetch("user_places.json")
      .then(response => {

        if (!response.ok) {
          throw new Error(
            "Could not load user_places.json"
          );
        }

        return response.json();

      }),


    fetch("places.json")
      .then(response => {

        if (!response.ok) {
          throw new Error(
            "Could not load places.json"
          );
        }

        return response.json();

      })

  ])

  .then(([
    userData,
    placeHistory,
    placeList
  ]) => {


    /*
      Keep verified users.
    */

    users = userData.filter(
      user =>
        user.api_status === "found"
    );


    /*
      Lookup:
      verified user ID -> visited places
    */

    userPlaces =
      placeHistory;


    /*
      Convert places.json to a Set
      for fast lookup.
    */

    clannerPlaces =
      new Set(
        placeList.map(
          placeId =>
            String(placeId)
        )
      );


    /*
      Precompute search strings.
    */

    users.forEach(user => {

      user._currentName =
        String(
          user.current_username ?? ""
        ).toLowerCase();


      user._oldName =
        String(
          user.original_name ?? ""
        ).toLowerCase();


      user._userId =
        String(
          user.roblox_user_id ?? ""
        );

    });


    /*
      Show every row at startup.
    */

    renderTable(users);

  })

  .catch(error => {

    console.error(error);

    count.textContent =
      "Error loading data. Check browser console.";

  });



  /*
    Escape HTML
  */

  function escapeHTML(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }



  /*
    Check whether account visited
    one of the current place IDs.
  */

  function isClanner(user) {

    const userId =
      String(
        user.roblox_user_id ?? ""
      );


    const visitedPlaces =
      userPlaces[userId] || [];


    return visitedPlaces.some(
      placeId =>
        clannerPlaces.has(
          String(placeId)
        )
    );

  }



  /*
    Render table
  */

  function renderTable(data) {

    tableBody.innerHTML =
      data.map(user => {


        const currentUsername =
          escapeHTML(
            user.current_username
          );


        const oldUsername =
          escapeHTML(
            user.original_name
          );


        const userId =
          escapeHTML(
            user.roblox_user_id
          );


        const hits =
          escapeHTML(
            user.hits
          );


        const firstSeen =
          escapeHTML(
            user.first_seen
          );


        const lastSeen =
          escapeHTML(
            user.last_seen
          );


        /*
          Only show logged username
          if it differs from current username.
        */

        const nameChanged =

          String(
            user.current_username ?? ""
          ).toLowerCase()

          !==

          String(
            user.original_name ?? ""
          ).toLowerCase();


        const oldNameDisplay =

          nameChanged

            ? `
              <span class="changed">
                ${oldUsername}
              </span>
            `

            : `
              <span class="same-name">
                —
              </span>
            `;


        const clanner =
          isClanner(user);


        const clannerDisplay =

          clanner

            ? `
              <span class="yes">
                Yes
              </span>
            `

            : `
              <span class="no">
                —
              </span>
            `;


        return `

          <tr>

            <td>
              ${currentUsername}
            </td>

            <td>
              ${userId}
            </td>

            <td>
              ${oldNameDisplay}
            </td>

            <td>
              ${hits}
            </td>

            <td>
              ${firstSeen}
            </td>

            <td>
              ${lastSeen}
            </td>

            <td>
              ${clannerDisplay}
            </td>

          </tr>

        `;

      }).join("");


    count.textContent =
      `${data.length.toLocaleString()} users`;

  }



  /*
    Actual search/filter
  */

  function performSearch() {

    const usernameQuery =
      usernameSearch.value
        .trim()
        .toLowerCase();


    const idQuery =
      userIdSearch.value
        .trim();


    /*
      Both text searches require
      at least 3 characters.
    */

    const usernameActive =
      usernameQuery.length >= 3;


    const idActive =
      idQuery.length >= 3;


    const clannerActive =
      clannerCheckbox.checked;


    /*
      No filters active:
      show everything.
    */

    if (
      !usernameActive &&
      !idActive &&
      !clannerActive
    ) {

      renderTable(users);

      return;

    }


    const results =
      users.filter(user => {


        /*
          Username search checks BOTH
          current and old username.
        */

        const matchesUsername =

          !usernameActive

          ||

          user._currentName.includes(
            usernameQuery
          )

          ||

          user._oldName.includes(
            usernameQuery
          );


        /*
          User ID search
        */

        const matchesId =

          !idActive

          ||

          user._userId.includes(
            idQuery
          );


        /*
          Clanner filter
        */

        const matchesClanner =

          !clannerActive

          ||

          isClanner(user);


        return (
          matchesUsername &&
          matchesId &&
          matchesClanner
        );

      });


    renderTable(results);

  }



  /*
    Delay text searching slightly.
  */

  function scheduleSearch() {

    clearTimeout(
      searchTimer
    );


    const usernameQuery =
      usernameSearch.value.trim();


    const idQuery =
      userIdSearch.value.trim();


    const usernameValid =
      usernameQuery.length >= 3;


    const idValid =
      idQuery.length >= 3;


    /*
      If neither search has 3 characters,
      do NOT search text.

      Show all rows, or only Clanners
      if checkbox is checked.
    */

    if (
      !usernameValid &&
      !idValid
    ) {


      if (
        clannerCheckbox.checked
      ) {

        performSearch();

      }

      else {

        renderTable(users);


        if (
          usernameQuery.length > 0 ||
          idQuery.length > 0
        ) {

          count.textContent =
            `${users.length.toLocaleString()} users — type at least 3 characters to search`;

        }

      }


      return;

    }


    count.textContent =
      "Searching...";


    searchTimer =
      setTimeout(
        performSearch,
        200
      );

  }



  usernameSearch.addEventListener(
    "input",
    scheduleSearch
  );


  userIdSearch.addEventListener(
    "input",
    scheduleSearch
  );


  clannerCheckbox.addEventListener(
    "change",
    performSearch
  );


</script>


</body>

</html>
